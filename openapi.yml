openapi: 3.0.3
info:
  title: Smart Solar Battery Calculator API
  version: 1.8.2
  description: Production API for Project N01. The original client MATLAB files are
    executed unchanged under GNU Octave. Retained input files and canonical CSV result
    artifacts are persisted in Supabase Storage; record metadata is persisted in PostgreSQL.
    Account email verification is optional; password reset requires an email address
    associated with an active account.
paths:
  /:
    get:
      operationId: api_root
      description: Human-readable discovery endpoint for the Smart Battery Calculator
        API.
      summary: API index
      tags:
      - System
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiRootResponse'
          description: ''
  /api/v1/accounts/auth/2fa/resend/:
    post:
      operationId: accounts_auth_2fa_resend_create
      tags:
      - User Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorResendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TwoFactorResendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TwoFactorResendRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorRequired'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/accounts/auth/2fa/verify/:
    post:
      operationId: accounts_auth_2fa_verify_create
      tags:
      - User Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/accounts/auth/logout/:
    post:
      operationId: accounts_auth_logout_create
      tags:
      - User Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
