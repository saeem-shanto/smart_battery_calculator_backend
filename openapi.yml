        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/accounts/me/two-factor/enable/:
    post:
      operationId: accounts_me_two_factor_enable_create
      description: Requires the current password and sends an OTP to the current account
        email. Successfully verifying the setup OTP also marks that exact email address
        as verified.
      summary: Start optional two-factor authentication setup
      tags:
      - User Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorEnableStartRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TwoFactorEnableStartRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TwoFactorEnableStartRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorRequired'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/accounts/me/two-factor/enable/verify/:
    post:
      operationId: accounts_me_two_factor_enable_verify_create
      tags:
      - User Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorEnableVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TwoFactorEnableVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TwoFactorEnableVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
          description: ''
        '400':
