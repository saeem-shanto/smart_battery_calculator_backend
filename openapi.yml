            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/accounts/me/avatar/:
    get:
      operationId: accounts_me_avatar_retrieve
      summary: Download the authenticated user's profile picture
      tags:
      - User Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: string
                format: binary
          description: Profile image.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/accounts/me/calculations/:
    get:
      operationId: accounts_me_calculations_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - User Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOwnedCalculationListList'
          description: ''
  /api/v1/accounts/me/email-verification/:
    get:
      operationId: account_email_verification_status
      description: Email verification is optional. Registration and normal sign-in
        do not require a verified email. This endpoint reports whether the authenticated
        user's current email address has been verified.
      summary: Get email verification status
      tags:
      - User Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationStatus'
          description: ''
  /api/v1/accounts/me/email-verification/request/:
    post:
      operationId: account_email_verification_request
      description: Sends a six-digit OTP to the authenticated user's current account
        email. Email verification is optional and may be completed later from account
        settings.
      summary: Send an email verification code
      tags:
      - User Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationChallenge'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/accounts/me/email-verification/resend/:
    post:
      operationId: account_email_verification_resend
      summary: Resend an email verification code
      tags:
      - User Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationResendRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationResendRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationResendRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerificationChallenge'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/accounts/me/email-verification/verify/:
    post:
      operationId: account_email_verification_verify
      description: Verifies only the exact email address to which the OTP challenge
        was sent.
      summary: Verify the account email
      tags:
      - User Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationVerifyRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/accounts/me/password/:
    post:
      operationId: accounts_me_password_create
      tags:
      - User Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
          multipart/form-data:
