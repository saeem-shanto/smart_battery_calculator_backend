    ClientWorkbookCalculationRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: Original client workbook. XLS/XLSX/CSV/TXT are accepted; column
            1 is the legacy/base PV profile and column 2 is household load.
        retain_data:
          type: boolean
          default: false
          description: Privacy/retention choice. If true, the unique input, canonical
            Results_RPAtrail400.csv and calculation record are persisted for later
            download/admin audit. If false, the request is processed transiently,
            no application database rows or file bytes are retained, and the CSV is
            returned inline in the response.
        consent:
          type: boolean
          description: Deprecated compatibility field. Older clients that omit retain_data
            use this value as the retention choice. New clients should send retain_data
            explicitly.
        postcode:
          description: Optional Australian 4-digit postcode. Persisted only when retain_data=true.
          oneOf:
          - type: string
            default: ''
            pattern: ^\d{4}$
          - type: string
            maxLength: 0
        suburb:
          type: string
          default: ''
          maxLength: 120
        state:
          type: string
          default: ''
          maxLength: 40
        metadata:
          description: Optional JSON object for non-algorithm record information.
            Persisted only when retain_data=true. In multipart/form-data this may
            be sent as a JSON string.
        battery_installed_cost_per_kwh:
          type: number
          format: double
          maximum: 10000
          minimum: 0
          default: 1000.0
          description: Installed battery cost used only for Django's simple-payback
            report (AUD/kWh). It does not alter the immutable MATLAB optimisation
            source.
      required:
      - file
    ClientWorkbookValidationRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: Client XLS/XLSX/CSV/TXT workbook to validate. This endpoint
            never stores the file or parsed values.
      required:
      - file
