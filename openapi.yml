components:
  schemas:
    AdminCalculation:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        owner_username:
          type: string
          readOnly: true
          nullable: true
        owner_email:
          type: string
          format: email
          readOnly: true
          nullable: true
        postcode:
          type: string
          maxLength: 12
        suburb:
          type: string
          maxLength: 120
        state:
          type: string
          maxLength: 40
        metadata: {}
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          readOnly: true
        source_mode:
          allOf:
          - $ref: '#/components/schemas/SourceModeEnum'
          readOnly: true
        input_filename:
          type: string
          nullable: true
          readOnly: true
        input_sha256:
          type: string
          nullable: true
          readOnly: true
        input_payload:
          readOnly: true
        result_payload:
          readOnly: true
        assumptions:
          readOnly: true
        warnings:
          readOnly: true
        algorithm_version:
          type: string
          readOnly: true
        runtime_ms:
          type: integer
          readOnly: true
        error_code:
          type: string
          readOnly: true
        error_message:
          type: string
          readOnly: true
        files:
          type: array
          items:
            $ref: '#/components/schemas/CalculationFile'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - algorithm_version
      - assumptions
      - created_at
      - error_code
      - error_message
      - files
      - input_filename
      - input_payload
      - input_sha256
      - owner_email
      - owner_username
      - public_id
      - result_payload
      - runtime_ms
      - source_mode
      - status
      - updated_at
      - warnings
    AdminCalculationList:
      type: object
      properties:
        public_id:
          type: string
          format: uuid
          readOnly: true
        owner_username:
          type: string
          readOnly: true
          nullable: true
        postcode:
          type: string
          maxLength: 12
        suburb:
          type: string
          maxLength: 120
        state:
          type: string
          maxLength: 40
        status:
          $ref: '#/components/schemas/StatusEnum'
        input_filename:
          type: string
          nullable: true
          readOnly: true
        input_sha256:
          type: string
