          description: No response body
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/accounts/me/two-factor/:
    get:
      operationId: accounts_me_two_factor_retrieve
      tags:
      - User Accounts
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorStatus'
          description: ''
  /api/v1/accounts/me/two-factor/disable/:
    post:
      operationId: accounts_me_two_factor_disable_create
      tags:
      - User Accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorDisableRequest'
          application/x-www-form-urlencoded:
            schema:
