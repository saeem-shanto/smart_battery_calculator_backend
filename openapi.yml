            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/v1/admin/calculations/:
    get:
      operationId: admin_calculations_list
      summary: List calculation records for the admin table
      parameters:
      - in: query
        name: has_csv
        schema:
          type: boolean
        description: Filter records with/without stored CSV bytes.
      - in: query
        name: has_input
        schema:
          type: boolean
        description: Filter records with/without stored input bytes.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: postcode
        schema:
          type: string
        description: Exact postcode filter.
      - in: query
        name: q
        schema:
          type: string
        description: Search postcode, suburb, state, filename, input SHA-256, or exact
          public UUID.
      - in: query
        name: state
        schema:
          type: string
        description: Case-insensitive state filter.
      - in: query
        name: status
        schema:
          type: string
        description: Filter by processing/completed/failed.
      tags:
      - Admin Dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminCalculationListList'
          description: ''
  /api/v1/admin/calculations/{public_id}/:
    get:
      operationId: admin_calculations_retrieve
      summary: View, update record metadata, or delete a calculation record
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin Dashboard
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCalculation'
          description: ''
        '204':
          description: Record deleted.
    put:
      operationId: admin_calculations_update
      summary: View, update record metadata, or delete a calculation record
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminCalculationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminCalculationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminCalculationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCalculation'
          description: ''
        '204':
          description: Record deleted.
    patch:
      operationId: admin_calculations_partial_update
      summary: View, update record metadata, or delete a calculation record
      parameters:
      - in: path
        name: public_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Admin Dashboard
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAdminCalculationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAdminCalculationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAdminCalculationRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCalculation'
          description: ''
        '204':
          description: Record deleted.
