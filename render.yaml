services:
  - type: web
    name: smart-battery-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: OCTAVE_EXECUTABLE
        value: octave-cli
      - key: OCTAVE_TIMEOUT_SECONDS
        value: "120"
      - key: OCTAVE_SERIALIZE_CALLS
        value: "True"
      - key: OCTAVE_DIAGNOSTICS_ENABLED
        value: "False"
      - key: REQUIRE_FULL_YEAR_PROFILE
        value: "True"
      - key: PROFILE_UPLOAD_TTL_HOURS
        value: "24"
      - key: PROFILE_UPLOAD_MAX_MB
        value: "15"
      - key: CALCULATION_RETENTION_DAYS
        value: "90"
      - key: SECURE_SSL_REDIRECT
        value: "False"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
