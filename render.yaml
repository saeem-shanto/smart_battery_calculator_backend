services:
  - type: web
    name: smart-battery-api
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_CONN_MAX_AGE
        value: "60"
      - key: DATABASE_CONNECT_TIMEOUT
        value: "10"
      - key: SUPABASE_STORAGE_ENABLED
        value: "True"
      - key: SUPABASE_STORAGE_BUCKET
        value: smart-battery-files
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_REGION
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_QUERYSTRING_EXPIRE
        value: "300"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ACCOUNT_EMAIL_ENABLED
        value: "True"
      - key: EMAIL_BACKEND
        value: anymail.backends.resend.EmailBackend
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: EMAIL_API_CONNECT_TIMEOUT
        value: "5"
      - key: EMAIL_API_READ_TIMEOUT
        value: "15"
      - key: PASSWORD_RESET_TIMEOUT_SECONDS
        value: "3600"
      - key: TWO_FACTOR_OTP_TTL_SECONDS
        value: "600"
      - key: TWO_FACTOR_OTP_RESEND_SECONDS
        value: "60"
      - key: TWO_FACTOR_OTP_MAX_ATTEMPTS
        value: "5"
      - key: OCTAVE_EXECUTABLE
        value: octave-cli
      - key: OCTAVE_TIMEOUT_SECONDS
        value: "300"
      - key: OCTAVE_SERIALIZE_CALLS
        value: "True"
      - key: OCTAVE_DIAGNOSTICS_ENABLED
        value: "False"
      - key: REQUIRE_FULL_YEAR_PROFILE
        value: "True"
      - key: PROFILE_UPLOAD_TTL_HOURS
        value: "24"
      - key: PROFILE_UPLOAD_MAX_MB
        value: "15"
      - key: PROFILE_AVATAR_MAX_MB
        value: "5"
      - key: CALCULATION_RETENTION_DAYS
        value: "90"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
