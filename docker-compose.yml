services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: battery
      POSTGRES_USER: battery
      POSTGRES_PASSWORD: battery
    ports:
      - "5434:5432"
    volumes:
      - battery_pgdata:/var/lib/postgresql/data

  api:
    build: .
    # Override production image defaults for local development.
    entrypoint: []
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DEBUG: "True"
      SECRET_KEY: dev-only-secret
      ALLOWED_HOSTS: localhost,127.0.0.1,0.0.0.0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      CSRF_TRUSTED_ORIGINS: http://localhost:3000
      DATABASE_URL: postgresql://battery:battery@db:5432/battery
      CALCULATION_ENGINE: reference_python
    depends_on:
      - db

volumes:
  battery_pgdata:
